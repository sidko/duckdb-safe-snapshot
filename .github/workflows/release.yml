name: Publish to PyPI

on:
  push:
    tags: ["v*", "retry/v*/**"]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      artifact_sha: ${{ steps.release.outputs.artifact_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - id: release
        run: |
          if [[ "$GITHUB_REF_NAME" == retry/v*/* ]]; then tag="${GITHUB_REF_NAME#retry/}"; tag="${tag%/*}"; else tag="$GITHUB_REF_NAME"; fi
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$(git rev-list -n 1 "refs/tags/$tag")" >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/duckdb-safe-snapshot
    permissions: {contents: read, id-token: write}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - run: cp tools/pypi_release_state.py "$RUNNER_TEMP/pypi_release_state.py"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.artifact_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip install --upgrade pip build pytest duckdb==1.5.5
          python -m build
          python -m venv consumer
          consumer/bin/python -m pip install dist/*.whl pytest duckdb==1.5.5
          consumer/bin/python -m pytest tests
      - id: existing
        env:
          DIST_DIR: dist
          PYPI_PACKAGE: duckdb-safe-snapshot
          PYPI_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: python "$RUNNER_TEMP/pypi_release_state.py"
      - if: steps.existing.outputs.state == 'publish'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: {skip-existing: true}
      - env:
          DIST_DIR: dist
          MODE: post
          PYPI_PACKAGE: duckdb-safe-snapshot
          PYPI_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: python "$RUNNER_TEMP/pypi_release_state.py"
  release:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          if [[ "$RELEASE_TAG" == *-* ]]; then gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          else gh release create "$RELEASE_TAG" --verify-tag --generate-notes; fi
