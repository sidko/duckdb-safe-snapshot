[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "duckdb-safe-snapshot"
version = "0.1.0"
description = "Lock-coordinated, checksummed DuckDB database and WAL snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sid Kalla" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["backup", "duckdb", "snapshot"]

[project.scripts]
duckdb-safe-snapshot = "duckdb_safe_snapshot.cli:main"

[project.urls]
Homepage = "https://github.com/sidko/duckdb-safe-snapshot"
Issues = "https://github.com/sidko/duckdb-safe-snapshot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
